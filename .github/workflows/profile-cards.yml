name: Generate Matrix Profile Cards

on:
  push:
    branches:
      - main
    paths-ignore:
      - "profile/**"
  schedule:
    - cron: "35 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matrix-profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Prepare output folder
        run: mkdir -p profile

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide_border=true&bg_color=050505&title_color=00FF41&text_color=B7FFB7&icon_color=00FF41
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=050505&title_color=00FF41&text_color=B7FFB7
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate portfolio project card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=portfolio-website&hide_border=true&bg_color=050505&title_color=00FF41&text_color=B7FFB7&icon_color=00FF41
          path: profile/pin-portfolio.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate banking project card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Banking-Website&hide_border=true&bg_color=050505&title_color=00FF41&text_color=B7FFB7&icon_color=00FF41
          path: profile/pin-banking.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate data science project card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=DATA-SCIENCE&hide_border=true&bg_color=050505&title_color=00FF41&text_color=B7FFB7&icon_color=00FF41
          path: profile/pin-data-science.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit updated profile cards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "Profile cards are unchanged."
            exit 0
          fi
          git commit -m "Update Matrix profile cards"
          git push
