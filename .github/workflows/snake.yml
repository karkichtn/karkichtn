name: Generate Matrix Contribution Snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matrix-contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300AA33&color_dots=%23E8FFE8,%23B7FFB7,%2370E070,%2324B324,%23006600
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300FF41&color_dots=%23001100,%23003300,%23006600,%2300AA00,%2300FF41

      - name: Publish generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
